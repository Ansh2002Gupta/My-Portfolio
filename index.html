    <!--
      Fonts are self-hosted, so there is no third-party preconnect. Preloading
      the two files used above the fold removes the swap flash without blocking
      rendering. `crossorigin` is required even for same-origin font preloads.

      Paths here are root-relative on purpose. Vite prepends the deployment
      base to them once, in both dev and build; writing %BASE_URL% instead
      makes the dev server emit the base twice.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Applies the stored or system theme before first paint so there is no
      flash of the wrong background. Deliberately tiny, synchronous and
      inline — a module script would run too late.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0C0E12');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
